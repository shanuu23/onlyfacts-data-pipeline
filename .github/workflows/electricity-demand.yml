name: Electricity Demand Pipeline

on:
  schedule:
    # 17:00 UTC = 3 AM AEST / 4 AM AEDT — safely after midnight in Australia
    - cron: "0 17 * * *"
  # Allows manual trigger from GitHub Actions tab (useful for testing)
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run electricity demand pipeline
        env:
          DB_HOST:     ${{ secrets.DB_HOST }}
          DB_PORT:     ${{ secrets.DB_PORT }}
          DB_NAME:     ${{ secrets.DB_NAME }}
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python electricity_demand/daily_pipeline.py
